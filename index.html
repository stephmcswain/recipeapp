<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Recipe App</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f5f7fa;
  --card: #ffffff;
  --accent: #a7b8c9;
  --accent-soft: #e6ecf2;
  --text: #2f3542;
  --subtle: #6b7280;
}

body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  background: var(--bg);
}

header {
  padding: 16px;
  background: white;
  position: sticky;
  top: 0;
}

.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

input, button, select {
  padding: 10px;
  border-radius: 12px;
  border: 1px solid #ddd;
}

button {
  background: var(--accent);
  color: white;
  border: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 14px;
  padding: 16px;
}

.card {
  background: var(--card);
  padding: 14px;
  border-radius: 18px;
  cursor: pointer;
}

.card img {
  width: 100%;
  border-radius: 12px;
}

.tag {
  display: inline-block;
  background: var(--accent-soft);
  padding: 4px 10px;
  margin: 2px;
  border-radius: 999px;
  font-size: 12px;
}

.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  padding: 20px;
  width: 500px;
  max-height: 85%;
  overflow-y: auto;
  border-radius: 20px;
}

/* FORM */
.form-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 14px;
}

.form-group label {
  font-size: 13px;
  color: var(--subtle);
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

.secondary-btn {
  background: #e5e7eb;
  color: #333;
}

/* Ingredient Builder */
.section-card {
  background: #f9fafb;
  padding: 10px;
  border-radius: 12px;
  margin-bottom: 12px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.section-header input {
  font-weight: 500;
}

.ingredient-row {
  display: flex;
  gap: 6px;
  margin-bottom: 6px;
}

.ingredient-row input {
  flex: 1;
}

.small-btn {
  padding: 4px 8px;
  font-size: 12px;
  border-radius: 8px;
}

.tag-input-container {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 6px;
  border: 1px solid #ddd;
  border-radius: 10px;
}

.tag-pill {
  background: var(--accent-soft);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.tag-pill span {
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h2>🍽️ My Recipes</h2>

  <div class="controls">
    <input id="search" placeholder="Search...">

    <select id="sortSelect">
      <option value="default">Sort</option>
      <option value="name">A–Z</option>
      <option value="calories">Calories</option>
      <option value="protein">Protein</option>
      <option value="fiber">Fiber</option>
      <option value="carbs">Carbs</option>
      <option value="fat">Fat</option>
      <option value="sugar">Sugar</option>
      <option value="sodium">Sodium</option>
      <option value="cholesterol">Cholesterol</option>
      <option value="saturated">Saturated Fat</option>
    </select>

    <select id="filterTag">
      <option value="all">All Tags</option>
    </select>

    <button onclick="showAddRecipe()">➕ Add</button>
    <button onclick="saveToFile()">💾 Save</button>
    <button onclick="document.getElementById('importFile').click()">📂 Import</button>
    <input type="file" id="importFile" style="display:none" onchange="importRecipes(event)">
  </div>
</header>

<div id="recipes" class="grid"></div>

<div class="modal" id="modal">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>

let recipes = [];

// LOAD
fetch("recipes.json")
  .then(res => res.json())
  .then(data => {
    recipes = data;
    populateTags();
    render();
  });

// RENDER
function render() {
  let search = document.getElementById("search").value.toLowerCase();
  let sort = document.getElementById("sortSelect").value;
  let filterTag = document.getElementById("filterTag").value;

  let filtered = recipes.filter(r => {
    const matchesSearch = r.name.toLowerCase().includes(search);
    const matchesTag = filterTag === "all" || (r.tags || []).includes(filterTag);
    return matchesSearch && matchesTag;
  });

  if (sort === "name") filtered.sort((a,b)=>a.name.localeCompare(b.name));
  if (sort === "calories") filtered.sort((a,b)=>(b.calories||0)-(a.calories||0));
  if (sort === "protein") filtered.sort((a,b)=>(b.protein||0)-(a.protein||0));
  if(sort === "fiber") filtered.sort((a,b)=>(b.fiber||0)-(a.fiber||0));
  if(sort === "carbs") filtered.sort((a,b)=>(b.carbs||0)-(a.carbs||0));
  if(sort === "fat") filtered.sort((a,b)=>(b.fat||0)-(a.fat||0));
  if(sort === "sugar") filtered.sort((a,b)=>(b.sugar||0)-(a.sugar||0));
  if(sort === "sodium") filtered.sort((a,b)=>(b.sodium||0)-(a.sodium||0));
  if(sort === "cholesterol") filtered.sort((a,b)=>(b.cholesterol||0)-(a.cholesterol||0));
  if(sort === "saturated") filtered.sort((a,b)=>(b.saturated||0)-(a.saturated||0));

  const container = document.getElementById("recipes");
  container.innerHTML = "";

  filtered.forEach(r => {
    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      ${r.image ? `<img src="${r.image}">` : ""}
      <strong>${r.name}</strong>
      <div>${(r.tags||[]).map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      <div>🔥 ${r.calories||0} | 💪 ${r.protein||0}g | 🧂 ${r.sodium||0}mg | 🧃 ${r.sugar||0}g | 🧂 ${r.cholesterol||0}mg | 🧂 ${r.saturated||0}g </div>
    `;

    div.onclick = () => openRecipe(r.number);
    container.appendChild(div);
  });
}

// TAGS
function populateTags() {
  const tagSet = new Set();
  recipes.forEach(r => (r.tags||[]).forEach(t => tagSet.add(t.trim())));

  const select = document.getElementById("filterTag");
  select.innerHTML = `<option value="all">All Tags</option>` +
    [...tagSet].map(t => `<option value="${t}">${t}</option>`).join("");
}

let currentTags = [];

function addTag() {
  const input = document.getElementById("tagInput");
  const value = input.value.trim();

  if (!value) return;

  currentTags.push(value);
  input.value = "";

  renderTags();
}

function removeTag(index) {
  currentTags.splice(index, 1);
  renderTags();
}

function renderTags() {
  const container = document.getElementById("tagContainer");

  container.innerHTML = currentTags.map((tag, i) => `
    <div class="tag-pill">
      ${tag}
      <span onclick="removeTag(${i})">✕</span>
    </div>
  `).join("");
}

// ADD MODAL
function showAddRecipe() {
  currentTags = [];
  const content = document.getElementById("modalContent");

  content.innerHTML = `
    <h2>➕ Add Recipe</h2>

    <div class="form-group">
      <label>Name</label>
      <input id="newName">
    </div>

<div class="form-group">
  <label>Tags</label>

  <div id="tagContainer" class="tag-input-container"></div>

  <div style="display:flex; gap:6px; margin-top:6px;">
    <input id="tagInput" placeholder="Add tag...">
    <button type="button" onclick="addTag()">Add</button>
  </div>
</div>

    <h3>Ingredients</h3>
    <div id="ingredientSections"></div>

    <button onclick="addSection()">➕ Add Section</button>

    <div class="form-group">
      <label>Instructions</label>
      <textarea id="newInstructions" rows="5"></textarea>
    </div>

    <div style="display:flex; gap:10px;">
      <input id="newCalories" placeholder="Calories">
      <input id="newProtein" placeholder="Protein">
    </div>

    <input type="file" id="newImage">

    <div class="modal-actions">
      <button onclick="saveRecipe()">Save</button>
      <button class="secondary-btn" onclick="closeModal()">Cancel</button>
    </div>
  `;

  document.getElementById("modal").style.display = "flex";

  addSection(); // start with one section
}

function addSection() {
  const container = document.getElementById("ingredientSections");

  const id = Date.now();

  const section = document.createElement("div");
  section.className = "section-card";
  section.dataset.id = id;

  section.innerHTML = `
    <div class="section-header">
      <input placeholder="Section name (e.g. Chicken)">
      <button class="small-btn" onclick="this.closest('.section-card').remove()">✕</button>
    </div>

    <div class="ingredients"></div>

    <button class="small-btn" onclick="addIngredient(${id})">+ Ingredient</button>
  `;

  container.appendChild(section);

  addIngredient(id);
}

function addIngredient(sectionId) {
  const section = document.querySelector(`[data-id="${sectionId}"]`);
  const container = section.querySelector(".ingredients");

  const row = document.createElement("div");
  row.className = "ingredient-row";

  row.innerHTML = `
    <input placeholder="Ingredient">
    <button class="small-btn" onclick="this.parentElement.remove()">✕</button>
  `;

  container.appendChild(row);
}

function collectIngredients() {
  const sections = document.querySelectorAll(".section-card");

  return Array.from(sections).map(section => {
    const title = section.querySelector("input").value;

    const items = Array.from(section.querySelectorAll(".ingredient-row input"))
      .map(i => i.value.trim())
      .filter(i => i);

    return { title, items };
  }).filter(s => s.items.length);
}

// SAVE NEW
function saveRecipe() {
  const newRecipe = {
    number: Date.now(),
    name: document.getElementById("newName").value,
    tags: currentTags,
    ingredients: collectIngredients(),
    instructions: document.getElementById("newInstructions").value,
    calories: parseInt(document.getElementById("newCalories").value)||0,
    protein: parseInt(document.getElementById("newProtein").value)||0,
    fiber: parseInt(document.getElementById("newFiber").value)||0,
    carbs: parseInt(document.getElementById("newCarbs").value)||0,
    fat: parseInt(document.getElementById("newFat").value)||0,
    sugar: parseInt(document.getElementById("newSugar").value)||0,
    sodium: parseInt(document.getElementById("newSodium").value)||0,
    cholesterol: parseInt(document.getElementById("newCholesterol").value)||0,
    saturated: parseInt(document.getElementById("newSaturated").value)||0,
    image: ""
  };

  const file = document.getElementById("newImage").files[0];

  if (file) {
    const reader = new FileReader();
    reader.onload = e => {
      newRecipe.image = e.target.result;
      recipes.push(newRecipe);
      render();
    };
    reader.readAsDataURL(file);
  } else {
    recipes.push(newRecipe);
    render();
  }

  closeModal();
}

// EDIT / DELETE
function openRecipe(id) {
  const r = recipes.find(x => String(x.number) === String(id));

  if (!r) {
    console.error("Recipe not found:", id);
    return;
  }

  const content = document.getElementById("modalContent");

  let ingredientsHTML = "";

if (Array.isArray(r.ingredients) && r.ingredients.length > 0) {

  // NEW FORMAT (sections)
  if (typeof r.ingredients[0] === "object") {
    ingredientsHTML = r.ingredients.map(section => `
      <h4 style="margin-bottom:4px;">${section.title}</h4>
      <ul>
        ${section.items.map(i => `<li>${i}</li>`).join("")}
      </ul>
    `).join("");
  }

  // OLD FORMAT (simple list)
  else {
    ingredientsHTML = `
      <ul>
        ${r.ingredients.map(i => `<li>${i}</li>`).join("")}
      </ul>
    `;
  }
} else {
    ingredientsHTML = "<p>No ingredients listed.</p>";
  }

  content.innerHTML = `
    <h2>${r.name}</h2>

    ${r.image ? `<img src="${r.image}" style="width:100%; border-radius:12px;">` : ""}

    <div style="margin:10px 0;">
      ${(r.tags || []).map(t => `<span class="tag">${t}</span>`).join("")}
    </div>

    <h3>Ingredients</h3>
    ${ingredientsHTML}

    <h3>Instructions</h3>
    <p style="white-space: pre-line;">${r.instructions || ""}</p>

    <div style="margin-top:10px;">
      <button onclick="editRecipe(${r.number})">✏️ Edit</button>
      <button onclick="deleteRecipe(${r.number})">🗑 Delete</button>
    </div>
  `;

  document.getElementById("modal").style.display = "flex";
}

function editRecipe(id) {
  currentTags = [...(r.tags || [])];
  renderTags();
  const r = recipes.find(x => x.number === id);
  const content = document.getElementById("modalContent");

  content.innerHTML = `
    <div class="modal-header">
      <h2>✏️ Edit Recipe</h2>
      <p style="color: var(--subtle); font-size: 13px;">Update your recipe</p>
    </div>

    <div class="form-group">
      <label>Recipe Name</label>
      <input id="editName" value="${r.name}">
    </div>

    <div class="form-group">
      <label>Tags</label>
      <input id="editTags" value="${(r.tags || []).join(", ")}">
    </div>

    <div class="form-group">
      <label>Ingredients (one per line)</label>
      <textarea id="editIngredients" rows="5">${(r.ingredients || []).join("\n")}</textarea>
    </div>

    <div class="form-group">
      <label>Instructions</label>
      <textarea id="editInstructions" rows="5">${r.instructions || ""}</textarea>
    </div>

    <div style="display:flex; gap:10px;">
      <div class="form-group" style="flex:1;">
        <label>Calories</label>
        <input id="editCalories" type="number" value="${r.calories || 0}">
      </div>

      <div class="form-group" style="flex:1;">
        <label>Protein (g)</label>
        <input id="editProtein" type="number" value="${r.protein || 0}">
      </div>
    </div>

      <div class="form-group" style="flex:1;">
        <label>Fiber (g)</label>
        <input id="editFiber" type="number" value="${r.fiber || 0}">
      </div> 

      <div class="form-group" style="flex:1;">
        <label>Carbs (g)</label>
        <input id="editCarbs" type="number" value="${r.carbs || 0}">
      </div>

      <div class="form-group" style="flex:1;">
        <label>Fat (g)</label>
        <input id="editFat" type="number" value="${r.fat || 0}">
      </div>

      <div class="form-group" style="flex:1;">
        <label>Sugar (g)</label>
        <input id="editSugar" type="number" value="${r.sugar || 0}">
      </div>

      <div class="form-group" style="flex:1;">
        <label>Sodium (mg)</label>
        <input id="editSodium" type="number" value="${r.sodium || 0}">
      </div>

      <div class="form-group" style="flex:1;">
        <label>Cholesterol (mg)</label>
        <input id="editCholesterol" type="number" value="${r.cholesterol || 0}">
      </div>

      <div class="form-group" style="flex:1;">
        <label>Saturated Fat (g)</label>
        <input id="editSaturated" type="number" value="${r.saturated || 0}">
      </div>

    <div class="form-group">
      <label>Replace Photo</label>
      <input type="file" id="editImage">
    </div>

    ${r.image ? `<img src="${r.image}" style="width:100%; border-radius:12px; margin-top:10px;">` : ""}

    <div class="modal-actions">
      <button onclick="saveEdit(${id})">💾 Save Changes</button>
      <button class="secondary-btn" onclick="closeModal()">Cancel</button>
    </div>
  `;
}

function deleteRecipe(id) {
  recipes = recipes.filter(r => r.number !== id);
  render();
  closeModal();
}

// IMPORT + MERGE
function importRecipes(event) {
  const file = event.target.files[0];
  const reader = new FileReader();

  reader.onload = e => {
    const imported = JSON.parse(e.target.result);

    imported.forEach(newR => {
      const index = recipes.findIndex(r => r.number === newR.number);
      if (index === -1) recipes.push(newR);
      else recipes[index] = newR;
    });

    populateTags();
    render();
  };

  reader.readAsText(file);
}

// SAVE FILE
function saveToFile() {
  const blob = new Blob([JSON.stringify(recipes, null, 2)]);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "recipes.json";
  a.click();
}

// EVENTS
document.getElementById("search").oninput = render;
document.getElementById("sortSelect").onchange = render;
document.getElementById("filterTag").onchange = render;

function closeModal() {
  document.getElementById("modal").style.display = "none";
}
document.getElementById("modal").onclick = (e) => {
  if (e.target.id === "modal") {
    closeModal();
  }
};

</script>

</body>
</html>
