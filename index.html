<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stephanie McSwain</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<section id="homePage" class="home-page">
  <main class="home-card">
    <h1>Stephanie McSwain</h1>
    <p class="home-intro">Welcome to my personal website. The Recipe App is one of my featured portfolio projects.</p>
    <div class="home-cta">
      <button onclick="showLoginPage()">Login to Recipe App</button>
    </div>

    <section class="portfolio-section">
      <h2>Contact</h2>
      <p>Connect with me:</p>
      <div class="contact-links">
        <a href="mailto:stephmcswain7@gmail.com" aria-label="Email link">Email</a>
        <a href="https://github.com/stephmcswain" target="_blank" rel="noreferrer" aria-label="GitHub link">GitHub</a>
        <a href="https://www.linkedin.com/in/stephanie-mcswain/" target="_blank" rel="noreferrer" aria-label="LinkedIn link">LinkedIn</a>
      </div>
      <p class="contact-note">Thanks for visiting my portfolio.</p>
    </section>
  </main>
</section>

<section id="authPage" class="auth-page" style="display:none;">
  <div class="auth-card">
    <h2>🔐 Recipe App Login</h2>
    <form id="authForm">
      <div class="form-group">
        <label for="authUsername">Username</label>
        <input id="authUsername" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="authPassword">Password</label>
        <input id="authPassword" type="password" autocomplete="current-password" required>
      </div>
      <div class="form-group" style="margin-top:-6px;">
        <label style="display:flex; align-items:center; gap:6px;">
          <input id="authTogglePassword" type="checkbox" style="width:auto; padding:0;">
          Show password
        </label>
      </div>
      <p id="authError" style="display:none; color:#b91c1c; margin:0 0 8px 0;">Login failed. Try again.</p>
      <div class="modal-actions">
        <button type="button" class="secondary-btn" onclick="showHomePage()">Back</button>
        <button type="submit">Login</button>
      </div>
    </form>
  </div>
</section>

<div id="appRoot" style="display:none;">
<header>
  <h2>🍽️ My Recipes</h2>

  <div class="controls">
    <input id="search" placeholder="Search...">

    <select id="sortSelect">
      <option value="default">Sort</option>
      <option value="name">A–Z</option>
      <option value="calories">Calories</option>
      <option value="protein">Protein</option>
      <option value="fiber">Fiber</option>
      <option value="carbs">Carbs</option>
      <option value="fat">Fat</option>
      <option value="sugar">Sugar</option>
      <option value="sodium">Sodium</option>
      <option value="cholesterol">Cholesterol</option>
      <option value="saturated">Saturated Fat</option>
    </select>

    <select id="filterTag">
      <option value="all">All Tags</option>
    </select>

    <button data-auth-required="true" onclick="showAddRecipe()">➕ Add a new recipe</button>
    <button onclick="saveToFile()">💾 Export Recipes</button>
    <button data-auth-required="true" onclick="document.getElementById('importFile').click()">📂 Import Recipes</button>
    <input type="file" id="importFile" style="display:none" onchange="importRecipes(event)">
    <button id="logoutBtn" onclick="logout()" style="display:none">🚪 Logout</button>
  </div>
</header>

<div id="recipes" class="grid"></div>

<div class="modal" id="modal">
  <div class="modal-content" id="modalContent"></div>
</div>
</div>

</body>
<link rel="stylesheet" href="css/styles.css">

<script type="module" src="js/main.js"></script>
</html>
